# libpq reads PGHOST, PGPORT, PGUSER and PGPASSWORD when omitted here.
# Nix supplies PGHOST pointing at the project's Unix socket.
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: rshb_stipa_development
  # Rails merges DATABASE_URL over these defaults when it is present.

test:
  <<: *default
  # Explicit URL prevents DATABASE_URL from redirecting tests to the app DB.
  # TEST_DATABASE_URL must always point at a separate, disposable database.
  url: <%= ENV.fetch("TEST_DATABASE_URL", "postgresql:///rshb_stipa_test") %>

production:
  primary: &primary_production
    <<: *default
    database: rshb_stipa_production
  cache:
    <<: *primary_production
    database: rshb_stipa_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: rshb_stipa_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: rshb_stipa_production_cable
    migrations_paths: db/cable_migrate
